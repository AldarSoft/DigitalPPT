# Replace example.com before enabling this site. Certbot adds the TLS listener
# after DNS points to this server and the initial HTTP configuration is active.
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    root /srv/digitalptt/frontend/dist;
    index index.html;
    client_max_body_size 6m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location = /health/ {
        proxy_pass http://127.0.0.1:8000/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /srv/digitalptt/backend/staticfiles/;
        access_log off;
        expires 7d;
    }

    location /media/ {
        alias /srv/digitalptt/backend/media/;
        access_log off;
        expires 1d;
    }

    location ^~ /.well-known/acme-challenge/ {
        allow all;
    }

    # PRIVATE_MEDIA_ROOT is deliberately not exposed by Nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
